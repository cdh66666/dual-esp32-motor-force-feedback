[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
# Native USB CDC on these ESP32-S3 boards can lose the port during reset when
# esptool switches to 460800. Keep flashing at the stable USB CDC rate.
upload_speed = 115200
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

[env:esp32-s3-jtag]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_protocol = esp-builtin
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

[env:esp32-s3-tinyusb]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=0
  -DTINYUSB_RECOVERY_BUILD=1
