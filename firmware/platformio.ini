[platformio]
default_envs = esp32-s3-devkitc-1

[usb_guard]
build_flags =
  -DPROJECT_USB_DCD_GUARD=1
  -Wl,--wrap=esp_intr_alloc
  -Wl,--wrap=dcd_edpt_xfer
  -Wl,--wrap=dcd_edpt_open
  -Wl,--wrap=dcd_edpt_close_all
  -Wl,--wrap=dcd_edpt_clear_stall
  -Wl,--wrap=dcd_set_address

[env:esp32-s3-devkitc-1]
extra_scripts = pre:../tools/embed_dashboard.py
platform = espressif32@6.4.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
# Native USB CDC on these ESP32-S3 boards can lose the port during reset when
# esptool switches to 460800. Keep flashing at the stable USB CDC rate.
upload_speed = 115200
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  # TinyUSB CDC is re-enumerated by the host after a JTAG/reset flash and
  # avoids the HWCDC OUT-endpoint stall seen on the USB Serial/JTAG path.
  -DARDUINO_USB_MODE=0
  -DTINYUSB_RECOVERY_BUILD=1
  ${usb_guard.build_flags}

[env:esp32-s3-jtag]
platform = espressif32@6.4.0
board = esp32-s3-devkitc-1
framework = arduino
upload_protocol = esp-builtin
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

[env:esp32-s3-tinyusb]
platform = espressif32@6.4.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=0
  -DTINYUSB_RECOVERY_BUILD=1
  ${usb_guard.build_flags}

[env:esp32-s3-tinyusb-jtag]
platform = espressif32@6.4.0
board = esp32-s3-devkitc-1
framework = arduino
upload_protocol = esp-builtin
monitor_speed = 115200
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=0
  ${usb_guard.build_flags}
