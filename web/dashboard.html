<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>双板三环电机调试台</title>
  <link rel="stylesheet" href="/dashboard.css?v=cascade-final-20260825">
  <link rel="stylesheet" href="/dashboard-cascade.css?v=cascade-final-20260825">
</head>
<body>
  <header class="topbar">
    <div><h1>双板三环电机调试台</h1><p>2 kHz 电流环 → 200 Hz 速度环 → 100 Hz 位置环 · USB 100 Hz 原始过程</p></div>
    <div class="top-actions">
      <label>显示单位 <select id="unit"><option value="deg">° / °/s</option><option value="rev">圈 / rps</option></select></label>
      <button id="connectAll">连接全部</button><button id="stopAll" class="danger">全部 STOP</button>
    </div>
  </header>
  <section class="fleet">
    <strong>双板同步操作</strong>
    <label>共同位置目标 <output id="fleetTargetOut">0°</output><input id="fleetTarget" type="range" min="-36000" max="36000" step="1" value="0"></label>
    <button id="fleetSend" class="primary">两板同时发送位置</button>
    <span id="portSummary">正在检测真实端口…</span>
  </section>
  <section class="haptic">
    <strong>双向力反馈</strong>
    <label>刚度 <output id="forceKOut">5 mA/°</output><input id="forceK" type="range" min="0" max="50" step="0.5" value="5"></label>
    <label>阻尼 <output id="forceDOut">0.10 mA/(°/s)</output><input id="forceD" type="range" min="0" max="2" step="0.05" value="0.1"></label>
    <label>电流上限 <output id="forceLimitOut">1000 mA</output><input id="forceLimit" type="range" min="100" max="4500" step="50" value="1000"></label>
    <button id="forceStart" class="primary">启动双向力反馈</button>
    <button id="forceStop" class="danger">停止力反馈</button>
    <span id="forceState">COM19 DATA 接收硬件暂缓；USB 三环调试不受影响</span>
  </section>
  <main id="boards"></main>
  <div id="toast"></div>
  <script type="module" src="/dashboard.js?v=cascade-final-20260825"></script>
</body>
</html>
